name: Storm bulletin video

on:
  workflow_dispatch:
  schedule:
    # GitHub cron chạy theo UTC. 02:30, 05:30, ..., 23:30 giờ GMT+7 (mỗi 3 giờ) = 19:30, 22:30, 01:30, ..., 16:30 UTC
    - cron: '30 1,4,7,10,13,16,19,22 * * *'

concurrency:
  group: storm-video
  cancel-in-progress: false

env:
  # Thư mục chứa video.php và video_github.php trong repo ('.' nếu nằm ở gốc).
  # ../config.php và ../vn.json sẽ được đặt ở thư mục cha của thư mục này.
  VIDEO_DIR: '.'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Cài PHP (đã có sẵn trên runner, chỉ bật extension)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, curl, mysqli, mbstring, xml, zip
          tools: none
          coverage: none

      - name: Cài ffmpeg bản static (có cache, không phụ thuộc thư viện hệ thống)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Cài font tiếng Việt
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core >/dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-dejavu-core)

      - name: Kiểm tra công cụ
        run: |
          fc-cache -f >/dev/null 2>&1 || true
          which ffmpeg
          php -v | head -1
          ffmpeg -version | head -1
          php -r 'var_dump(function_exists("imagettftext"), function_exists("proc_open"));'

      - name: Ghi config.php và token YouTube từ secrets
        env:
          CONFIG_PHP: ${{ secrets.CONFIG_PHP }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          VBEE_APP_ID: ${{ secrets.VBEE_APP_ID }}
          VBEE_TOKEN: ${{ secrets.VBEE_TOKEN }}
        run: |
          set -eu
          dir="$(cd "$VIDEO_DIR" && pwd)"
          parent="$(dirname "$dir")"
          if [ -n "$CONFIG_PHP" ]; then
            printf '%s' "$CONFIG_PHP" > "$parent/config.php"
          else
            echo "Không có secret CONFIG_PHP - tự sinh config.php từ secret DB_*, VBEE_* (YouTube lấy từ bảng tb_bao_secret)"
            php -r '
              $o = "<?php\n";
              foreach (["VBEE_APP_ID","VBEE_TOKEN"] as $k) {
                  $o .= "define(" . var_export($k, true) . ", " . var_export((string)getenv($k), true) . ");\n";
              }
              $o .= "mysqli_report(MYSQLI_REPORT_OFF);\n";
              $o .= "\$conn = @new mysqli(" . var_export((string)getenv("DB_HOST"), true) . ", "
                  . var_export((string)getenv("DB_USER"), true) . ", "
                  . var_export((string)getenv("DB_PASS"), true) . ", "
                  . var_export((string)getenv("DB_NAME"), true) . ", "
                  . ((int)getenv("DB_PORT") ?: 3306) . ");\n";
              $o .= "if (!\$conn->connect_error) { \$conn->set_charset(\"utf8mb4\"); }\n";
              file_put_contents($argv[1], $o);
            ' "$parent/config.php"
          fi
          php -r 'require $argv[1]; if (!isset($conn)) { fwrite(STDERR, "config.php không tạo biến \$conn\n"); exit(1);} if ($conn->connect_error) { fwrite(STDERR, "Lỗi MySQL: " . $conn->connect_error . "\n"); exit(1);} echo "Kết nối MySQL OK\n";' "$parent/config.php"
          chmod 600 "$parent/config.php"
          [ -f "$dir/vn.json" ] && [ ! -f "$parent/vn.json" ] && cp "$dir/vn.json" "$parent/vn.json" || true
          # VIDEO_GITHUB_KEY không cần khi chạy CLI; đảm bảo có font/ffmpeg ở đường dẫn mặc định
          grep -q "define('VIDEO_GITHUB_KEY'" "$parent/config.php" || echo "(config.php không có VIDEO_GITHUB_KEY - không sao khi chạy CLI)"

      - name: Cache bản đồ và giọng đọc
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VIDEO_DIR }}/tile_cache
            ${{ env.VIDEO_DIR }}/tts_cache
          key: storm-cache-${{ github.run_id }}
          restore-keys: storm-cache-

      - name: Chạy video.php nội bộ (ffmpeg trên runner)
        run: |
          set -eu
          dir="$(cd "$VIDEO_DIR" && pwd)"
          cd "$dir"
          PHP_CLI_SERVER_WORKERS=4 nohup php -d memory_limit=1024M -d max_execution_time=7200 \
            -S 127.0.0.1:8080 -t "$dir" > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8080/video.php && break || sleep 1
          done

      - name: Chạy bản tin tuần tự cho tới khi hết
        env:
          VIDEO_BASE_URL: http://127.0.0.1:8080/video.php
        run: |
          set -u
          cd "$VIDEO_DIR"
          errors=0
          for i in $(seq 1 6000); do
            out=$(php -d memory_limit=1024M video_github.php tick 2>&1) || true
            state=$(echo "$out" | jq -r '.state // "error"' 2>/dev/null || echo error)
            echo "[$i] $(echo "$out" | jq -c '{state, current, uploaded, failed, remaining, message, error}' 2>/dev/null || echo "$out" | head -c 400)"
            case "$state" in
              working) errors=0; sleep 3 ;;
              idle)
                echo "$out" | jq . 2>/dev/null || echo "$out"
                [ "$(echo "$out" | jq -r '.failed // 0')" -gt 0 ] && exit 1
                exit 0 ;;
              *) errors=$((errors+1)); [ "$errors" -ge 3 ] && { echo "$out"; tail -n 40 /tmp/php-server.log; exit 1; }; sleep 15 ;;
            esac
          done
          echo "Hết số vòng lặp tối đa"; exit 1

      - name: Dọn file nhạy cảm
        if: always()
        run: |
          dir="$(cd "$VIDEO_DIR" && pwd)"
          rm -f "$(dirname "$dir")/config.php"
